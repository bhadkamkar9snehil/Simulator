name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare bundled offline environment
        shell: pwsh
        run: python .\suite_runtime.py ensure-env
      - name: Run simulator tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest .\industrial_simulator\tests -q

  unified-runtime-complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install complexity checker
        run: python -m pip install --disable-pip-version-check xenon
      - name: Reject new D/E/F complexity in unified runtime
        run: xenon --max-absolute C --max-modules C --max-average B industrial_simulator/app/simulation
